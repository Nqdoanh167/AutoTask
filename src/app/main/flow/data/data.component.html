<div class="data-site">
  <div class="card">
    <div class="card-body">
      <tabset class="custom-tab-basic">
        <tab
          *ngFor="let tab of tabs"
          [active]="tab.key === activeTab"
          (selectTab)="selectTab(tab.key)"
        >
          <ng-template tabHeading>
            <div class="title-tab">
              <span>{{ tab.name }}</span>
            </div>
          </ng-template>
        </tab>
      </tabset>
      <div class="content-site mt-3">
        <ng-container [ngSwitch]="activeTab">
          <ng-container *ngSwitchCase="ETabConfigData.ACTION">
            <app-action></app-action>
          </ng-container>
          <ng-container *ngSwitchCase="ETabConfigData.CHAIN_ACTION">
            <app-chain-action></app-chain-action>
          </ng-container>
          <ng-container *ngSwitchCase="ETabConfigData.RESULT">
            <app-result></app-result>
          </ng-container>
          <ng-container *ngSwitchCase="ETabConfigData.REASON">
            <app-reason></app-reason>
          </ng-container>
          <ng-container *ngSwitchDefault>
            <app-action></app-action>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
</div>
