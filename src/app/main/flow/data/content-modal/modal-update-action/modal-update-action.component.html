<div class="modal-update-action">
  <app-custom-modal [isSubmitting]="loading.submit" (submitModal)="onSubmit()">
    <ng-container modalTitle>
      {{ sourceData?.id ? 'Chỉnh sửa' : 'Thêm mới' }} Hành động
    </ng-container>
    <ng-container modalBody>
      <form [formGroup]="updateForm">
        <div class="mb-2">
          <label class="form-control-label" for="name">
            Tên hành động
            <span class="required">*</span>
          </label>
          <input
            class="form-control"
            [ngClass]="{'is-invalid': submitted && f['name'].errors}"
            [placeholder]="'Nhập tên Hành động...'"
            formControlName="name"
            id="name"
            type="text"
          />
          <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
            <div *ngIf="f['name'].errors?.['required']">
              Tên hành động không được bỏ trống
            </div>
            <div *ngIf="f['name'].errors?.['maxlength']">
              Tên hành động không hợp lệ
            </div>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-control-label" for="actionType">
            Loại
            <span class="required">*</span>
          </label>
          <ng-select
            [ngClass]="{
              'is-invalid': submitted && f['type'].errors
            }"
            [placeholder]="'Chọn loại hành động'"
            [searchable]="false"
            appearance="outline"
            formControlName="type"
            id="actionType"
            labelForId="actionType"
            appendTo=".modal"
          >
            <ng-container>
              <ng-option
                *ngFor="let item of actionTypes; index as i"
                [value]="item.value"
              >
                {{ item.label }}
              </ng-option>
            </ng-container>
          </ng-select>
          <div *ngIf="submitted && f['type'].errors" class="invalid-feedback">
            <div *ngIf="f['type'].errors?.['required']">
              Loại hành động không được bỏ trống
            </div>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-control-label" for="results">
            Kết quả có thể xảy ra
          </label>
          <ng-select
            [ngClass]="{
              'is-invalid': submitted && f['resultIds'].errors
            }"
            [placeholder]="'Chọn kết quả'"
            [searchable]="false"
            [multiple]="true"
            [items]="results"
            class="dropdown-auto-width custom-input-multiple"
            formControlName="resultIds"
            id="results"
            labelForId="results"
            bindValue="id"
            bindLabel="name"
            appendTo=".modal"
          ></ng-select>
        </div>
        <div class="mb-2">
          <label class="form-control-label" for="reasons">
            Nguyên nhân có thể xảy ra
          </label>
          <ng-select
            [ngClass]="{
              'is-invalid': submitted && f['reasonIds'].errors
            }"
            [placeholder]="'Chọn nguyên nhân'"
            [searchable]="false"
            [multiple]="true"
            [items]="reasons"
            class="dropdown-auto-width custom-input-multiple"
            appearance="outline"
            formControlName="reasonIds"
            id="reasons"
            labelForId="dataType"
            appendTo=".modal"
          ></ng-select>
        </div>
      </form>
    </ng-container>
  </app-custom-modal>
</div>

<ng-template #loadingTemp>
  <div class="w-100 text-center">
    <div class="spinner-border" role="status">
      <span class="sr-only">Đang tải</span>
    </div>
  </div>
</ng-template>
