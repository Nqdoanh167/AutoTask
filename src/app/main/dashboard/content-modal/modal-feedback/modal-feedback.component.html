<form [formGroup]="form" [ngClass]="{'was-validated': submitted}">
  <div class="custom-modal modal-default">
    <div class="modal-header">
      <h4 class="modal-title pull-left">Tạo đánh giá mới</h4>
      <button
        type="button"
        class="btn-close close pull-right"
        aria-label="Close"
        (click)="hideModal()"
      >
        <span aria-hidden="true" class="visually-hidden">&times;</span>
      </button>
    </div>
    @if (!loading.getConfig) {
      <div class="modal-body">
        <div class="row">
          <div class="col-sm-12">
            <div class="card p-0">
              <div class="card-body bg-white">
                <div
                  class="mb-2"
                  *ngIf="criteriaArray.controls.length > 0; else noCriteria"
                >
                  <label class="form-control-label fw-bold mb-2">
                    Tiêu chí đánh giá
                  </label>
                  <div
                    class="criteria-container bg-light rounded p-3"
                    formArrayName="criterias"
                  >
                    <div
                      *ngFor="
                        let criteria of criteriaArray.controls;
                        let i = index
                      "
                      class="d-flex align-items-center justify-content-between border-bottom"
                      [formGroupName]="i"
                    >
                      <div class="criteria-info">
                        <label class="form-control-label mb-0">
                          {{ criteria.get('name')?.value }}
                        </label>
                      </div>
                      <ng-container
                        *ngIf="criteria.get('type')?.value === 'rating_star'"
                      >
                        <div class="criteria-rating">
                          <ngx-stars
                            [readonly]="false"
                            [size]="2"
                            [maxStars]="5"
                            [color]="'#FFD700'"
                            [initialStars]="criteria.get('rating')?.value || 5"
                            (ratingOutput)="
                              criteria.get('rating')?.setValue($event)
                            "
                          ></ngx-stars>
                        </div>
                      </ng-container>

                      <ng-container
                        *ngIf="criteria.get('type')?.value === 'rating_text'"
                      >
                        <ng-select
                          class="ng-select-custom"
                          style="width: 176px"
                          [placeholder]="'Chọn đánh giá'"
                          [clearable]="false"
                          formControlName="rating"
                        >
                          <ng-option
                            *ngFor="let option of criteria.get('config')?.value"
                            [value]="option.star"
                          >
                            {{ option.text }}
                          </ng-option>
                        </ng-select>
                      </ng-container>
                    </div>

                    <div class="d-flex align-items-baseline gap-2 mt-2">
                      <label class="form-control-label fw-bold">
                        Điểm trung bình:
                      </label>
                      <div class="d-flex align-items-center gap-2">
                        {{ getAverageRating() | number: '1.1-1' }} / 5
                        <ngx-stars
                          [readonly]="true"
                          [size]="1"
                          [maxStars]="5"
                          [color]="'#FFD700'"
                          [initialStars]="getAverageRating()"
                        ></ngx-stars>
                      </div>
                    </div>
                  </div>
                </div>

                <ng-template #noCriteria>
                  <div class="mb-2">
                    <div>
                      <label class="form-control-label fw-bold mb-2">
                        Đánh giá
                      </label>
                    </div>
                    <div class="rating-container bg-light rounded p-3">
                      <div class="d-flex align-items-center">
                        <ngx-stars
                          [readonly]="false"
                          [size]="2"
                          [maxStars]="5"
                          [initialStars]="form.value.rate || 5"
                          [color]="'#FFD700'"
                          (ratingOutput)="form.get('rate')?.setValue($event)"
                        ></ngx-stars>
                      </div>
                      <div
                        class="invalid-feedback d-block"
                        *ngIf="isFieldInvalid('rate')"
                      >
                        Vui lòng đánh giá
                      </div>
                    </div>
                  </div>
                </ng-template>

                <!-- Comment Section -->
                <div class="mb-2">
                  <label class="form-control-label fw-bold mb-2" for="feedback">
                    Mô tả đánh giá
                  </label>
                  <textarea
                    id="feedback"
                    name="customerFeedback"
                    placeholder="Chi tiết đánh giá"
                    formControlName="comment"
                    rows="3"
                  ></textarea>
                  <div
                    class="invalid-feedback d-block"
                    *ngIf="isFieldInvalid('comment')"
                  >
                    Vui lòng nhập chi tiết đánh giá
                  </div>
                </div>

                <!-- Images Section -->
                <div>
                  <label class="form-control-label fw-bold mb-2">
                    Hình ảnh
                  </label>
                  <div id="media">
                    <app-input-upload-preview
                      [immediateUpload]="true"
                      [multiple]="true"
                      [width]="80"
                      [height]="80"
                      [showButtonRight]="false"
                      [urls]="f['pictures'].value"
                      (filesChanges)="handleChangeMedia($event)"
                      (urlsChanges)="handleUrlMediaChanges($event)"
                      [loadingUpload]="loading.upload"
                    ></app-input-upload-preview>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    } @else {
      <div class="modal-body">
        <div
          class="d-flex flex-column align-items-center justify-content-center"
          [style.height]="'200px'"
        >
          <div class="spinner-grow text-primary" role="status">
            <span class="visually-hidden">Loading</span>
          </div>
          <div>Loading</div>
        </div>
      </div>
    }

    <div class="modal-footer">
      <div class="d-flex gap-2">
        <button
          class="btn btn-light"
          style="min-width: 120px"
          (click)="hideModal()"
        >
          Đóng
        </button>
        <button
          [disabled]="loading.submit"
          class="btn btn-primary text-white ms-2"
          style="min-width: 120px"
          (click)="onSubmit()"
        >
          <i class="fas fa-spinner fa-spin" *ngIf="loading.submit"></i>
          Gửi đánh giá
        </button>
      </div>
    </div>
  </div>
</form>
