<app-custom-modal [hideFooter]="true" [type]="'lack-center'">
  <ng-container modalBody>
    <div>
      <p class="title-4 text-center success-text">
        Gọi điện
        <i class="fa-solid fa-phone ms-2"></i>
      </p>
      <div>
        <label class="form-control-label">
          Thông tin người gọi
          <i class="fa-solid fa-headset ms-1"></i>
          :
        </label>
        <div class="d-flex justify-content-between align-items-center">
          <div class="d-flex gap-2 align-items-center">
            <img src="{{ currentUser?.picture }}" class="avatar" alt="" />
            <div class="fw-500">{{ currentUser?.name || '-' }}</div>
          </div>
          <div class="fw-500">SĐT sử dụng: {{ connectedPhone.hotline }}</div>
        </div>
      </div>
      <div class="mt-3">
        <label class="form-control-label">
          Thông tin khách hàng
          <i class="fa-solid fa-mobile-screen-button ms-1"></i>
          :
        </label>
        <div class="d-flex d-flex justify-content-between align-items-center">
          <div class="d-flex gap-2 align-items-center">
            @if (customer?.picture) {
              <img src="{{ customer?.picture }}" class="avatar" alt="" />
            }
            <div class="fw-500">{{ customer?.name || '-' }}</div>
          </div>
          <div class="fw-500">SĐT người nhận: {{ customer?.phone || '-' }}</div>
        </div>
      </div>
      <div class="mt-4">
        <div class="buttons d-flex gap-2">
          <button
            class="btn button-medium button-outline w-100"
            type="button"
            (click)="hideModal()"
          >
            Đóng
          </button>
          @if ((outgoingCall$ | async) === null) {
            <button
              class="btn button-medium button-fill success-color w-100"
              type="button"
              (click)="handleCall()"
              [disabled]="loading"
            >
              @if (loading) {
                <i class="fas fa-spinner fa-spin me-2"></i>
              }
              Gọi
            </button>
          }
        </div>
      </div>
    </div>
  </ng-container>
</app-custom-modal>
