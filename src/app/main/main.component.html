<div class="wrapper">
  <!-- <app-sidebar></app-sidebar> -->
  <app-sidebar *ngIf="currentBiz && !isHiddenSidebar"></app-sidebar>
  <div class="content-wrapper" style="height: 100vh;" [ngClass]="{'ps-0': isHiddenSidebar}">
    <ng-container *ngIf="currentBiz; else nonBiz">
      <app-header>
        <div class="left d-flex flex-wrap align-items-center">
          <ul class="nav flex-nowrap">
            <li *ngFor="let item of listNavItems" class="nav-item">
              <a
                [routerLink]="[item.link]"
                class="nav-link"
                routerLinkActive="active"
              >
                {{ item.name || '-' }}
              </a>
            </li>
          </ul>
          
          <!-- Lead Dashboard Filters (only show in lead module) -->
          <div 
            *ngIf="isLeadDashboard" 
            class="lead-header-filters ms-3"
          >
            <app-input-checkbox
              [value]="leadCheckbox.branchIds"
              [listItemSelect]="leadCheckbox.listBranches"
              [enableRemove]="false"
              [isSelectAll]="true"
              [isValidPermissionCheckbox]="true"
              tooltipText="Chi nhánh"
              tooltipPlacement="right"
              customClass="h-sm"
              class="input-checkbox"
              placeholder="Chi nhánh"
              [enableSearch]="false"
              (onChange)="onLeadBranchChange($event)"
              [templateValue]="tempBranchValue"
            ></app-input-checkbox>
            <ng-template #tempBranchValue let-model="item">
              {{ leadCheckbox.branchDisplayInputText }}
            </ng-template>
            <app-input-checkbox
              [value]="leadCheckbox.roleIds"
              [listItemSelect]="leadCheckbox.listRoles"
              [enableRemove]="false"
              tooltipText="Vai trò"
              tooltipPlacement="right"
              customClass="h-sm"
              class="input-checkbox"
              placeholder="Vai trò"
              [enableSearch]="false"
              (onChange)="onLeadRoleChange($event)"
            ></app-input-checkbox>
            <app-input-checkbox
              [value]="leadCheckbox.userIds"
              [listItemSelect]="leadCheckbox.listUsers"
              [enableRemove]="false"
              tooltipText="Thành viên"
              tooltipPlacement="right"
              customClass="h-sm"
              class="input-checkbox"
              placeholder="Thành viên"
              [enableSearch]="true"
              [isSelectAll]="true"
              (onChange)="onLeadUserChange($event)"
            ></app-input-checkbox>
          </div>
        </div>
      </app-header>
      <div class="router-outlet-container">
        <router-outlet></router-outlet>
      </div>
    </ng-container>
    <ng-template #nonBiz>
      <div class="loading">
        <div class="spinner-grow text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <div>Loading...</div>
      </div>
    </ng-template>
  </div>
</div>
<modal-confirm></modal-confirm>
