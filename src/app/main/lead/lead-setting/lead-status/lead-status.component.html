<div class="lead-status">
  <!-- Top Actions -->
  <div class="lead-status__header mb-3">
    <div class="d-flex justify-content-end align-items-center">
      <button class="btn btn-primary" (click)="onAddNew()">
        <i class="fas fa-plus me-2"></i>
        Thêm trạng thái
      </button>
    </div>
  </div>

  <!-- Filter & Search -->
  <app-filter-top-table
    [configFilters]="configFilters"
    (searchEvent)="onSearchEvent($event)"
  ></app-filter-top-table>

  <!-- Table -->
  <div class="lead-status__table mt-3">
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th style="width: 3%;"></th>
            <th style="width: 22%;">Tên</th>
            <th style="width: 15%;">Loại</th>
            <th style="width: 30%;">Mô tả</th>
            <th style="width: 10%;" class="text-center">Trạng thái</th>
            <th style="width: 10%;">Cập nhật cuối</th>
            <th style="width: 10%;" class="text-end">Thao tác</th>
          </tr>
        </thead>
        <tbody cdkDropList (cdkDropListDropped)="onDrop($event)">
          <tr *ngIf="loading">
            <td colspan="7" class="text-center py-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </td>
          </tr>
          <tr *ngIf="!loading && dataSource.length === 0">
            <td colspan="7" class="text-center py-4">
              <i class="fas fa-inbox fa-3x text-muted mb-2"></i>
              <p class="text-muted mb-0">Chưa có trạng thái nào</p>
            </td>
          </tr>
          <tr 
            *ngFor="let item of dataSource" 
            cdkDrag
            [class.cdk-drag-preview]="false"
          >
            <td class="drag-handle-cell">
              <button 
                class="btn btn-sm btn-link p-0 text-muted drag-handle"
                cdkDragHandle
                title="Kéo để sắp xếp"
              >
                <i class="fa-solid fa-grip-vertical"></i>
              </button>
            </td>
            <td>
              <div>
                <div class="d-flex align-items-center mb-1">
                  <span class="fw-bold">{{ item.name }}</span>
                </div>
                <span 
                  class="badge status-preview" 
                  [style.background-color]="item.bgColor"
                >
                  {{ item.name }}
                </span>
              </div>
            </td>
            <td>
              <span class="badge bg-secondary">
                {{ statusTypeLabels[item.type] }}
              </span>
            </td>
            <td>
              <span class="text-muted">{{ item.description || '—' }}</span>
            </td>
            <td class="text-center">
              <span 
                class="badge" 
                [class.bg-success]="item.isActive"
                [class.bg-secondary]="!item.isActive"
              >
                {{ item.isActive ? 'Kích hoạt' : 'Tắt' }}
              </span>
            </td>
            <td>
              <small class="text-muted">{{ item.updatedAt | date: 'HH:mm dd/MM/yyyy' }}</small>
            </td>
            <td class="text-end">
              <div class="d-flex">
                <button
                  class="btn btn-sm btn-outline-success me-1"
                  (click)="onSetDefault(item)"
                  title="Đặt làm mặc định"
                  [disabled]="item.isDefault"
                  [attr.data-bs-toggle]="item.isDefault ? 'tooltip' : null"
                  [attr.data-bs-title]="item.isDefault ? 'Trạng thái này đã là mặc định' : null"
                >
                  <i class="fas fa-star"></i>
                </button>
                <button
                  class="btn btn-sm btn-outline-primary me-1"
                  (click)="onEdit(item)"
                  title="Chỉnh sửa"
                >
                  <i class="fas fa-edit"></i>
                </button>
                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="onDelete(item)"
                  title="Xóa"
                  [disabled]="item.isDefault"
                >
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
