<app-custom-modal
  [isSubmitting]="isSubmitting"
  [textOk]="'Lưu'"
  (hideModal)="onCancel()"
  (submitModal)="onSubmit()"
>
  <h5 modalTitle>
    {{ isEditMode ? 'Chỉnh sửa Tag' : 'Thêm Tag mới' }}
  </h5>

  <div modalBody>
    <form [formGroup]="tagForm" (ngSubmit)="onSubmit()">
      <!-- Preview Tag -->
      <div class="tag-preview-section mb-3">
        <label class="form-label">Xem trước</label>
        <div class="tag-preview" [ngStyle]="previewStyle">
          <i class="fas {{ selectedIcon }} me-2"></i>
          <span>{{ tagForm.get('name')?.value || 'Tag mẫu' }}</span>
        </div>
      </div>

      <!-- Tên Tag -->
      <div class="form-group mb-2">
        <label class="form-label">
          Tên Tag <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="name"
          placeholder="Nhập tên tag..."
          [class.is-invalid]="isFieldInvalid('name')"
        />
        <div class="invalid-feedback" *ngIf="isFieldInvalid('name')">
          {{ getErrorMessage('name') }}
        </div>
      </div>

      <!-- Mô tả -->
      <div class="form-group mb-2">
        <label class="form-label">Mô tả</label>
        <textarea
          class="form-control"
          formControlName="description"
          placeholder="Nhập mô tả tag..."
          rows="2"
        ></textarea>
      </div>

      <!-- Trạng thái -->
      <div class="form-group mb-3">
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            formControlName="isActive"
            id="isActive"
          />
          <label style="transform: translate(8px, 6px)" class="form-check-label" for="isActive">
            Kích hoạt
          </label>
        </div>
      </div>

      <!-- Màu sắc & Icon -->
      <div class="section-divider">
        <span class="section-title">Giao diện</span>
      </div>

      <!-- Màu sắc -->
      <div class="form-group mb-2">
        <label class="form-label">Màu sắc</label>
        <div class="color-picker-grid">
          <div
            *ngFor="let colorOption of predefinedColors"
            class="color-option"
            [class.selected]="tagForm.get('bgColor')?.value === colorOption.bg"
            [style.background-color]="colorOption.bg"
            [attr.title]="colorOption.name"
            (click)="selectColor(colorOption)"
          >
            <i class="fas fa-check" *ngIf="tagForm.get('bgColor')?.value === colorOption.bg"></i>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-md-6">
            <label class="form-label-sm">Màu nền</label>
            <input
              type="color"
              class="form-control form-control-color"
              formControlName="bgColor"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label-sm">Màu chữ</label>
            <input
              type="color"
              class="form-control form-control-color"
              formControlName="color"
            />
          </div>
        </div>
      </div>

      <!-- Icon -->
      <div class="form-group mb-2">
        <label class="form-label">Icon</label>
        <div class="icon-picker-grid">
          <div
            *ngFor="let iconOption of predefinedIcons"
            class="icon-option"
            [class.selected]="tagForm.get('icon')?.value === iconOption"
            (click)="selectIcon(iconOption)"
          >
            <i class="fas {{ iconOption }}"></i>
          </div>
        </div>
      </div>
    </form>
  </div>
</app-custom-modal>
