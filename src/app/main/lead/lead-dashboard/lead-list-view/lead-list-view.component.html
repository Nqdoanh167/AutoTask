<div>
  <div class="card">
    <div class="card-body">
      <div class="table-responsive tableFixHead custom-scrollbar">
        <table class="table ui-v2">
          <thead>
            <tr *ngIf="!getLengthCheckRow()">
              <th>
                <label class="basic-checkbox standalone">
                  <input
                    type="checkbox"
                    (change)="handleSelectRow({type: 'all', event: $event})"
                    [checked]="isAllChecked()"
                  />
                  <span class="checkmark"></span>
                </label>
              </th>

              <ng-container *ngFor="let columns of dataColumnsShow; index as i">
                <th
                  [ngClass]="{
                    'last-column': i === dataColumnsShow.length - 1
                  }"
                >
                  <div
                    class="d-flex align-items-center gap-2"
                    [ngClass]="{
                      'justify-content-end': i === dataColumnsShow.length - 1
                    }"
                  >
                    <i
                      *ngIf="columns.showTooltip"
                      class="fa fa-question-circle"
                      [tooltipHtml]="columns.tooltip || ''"
                    ></i>
                    {{ columns.name }}
                    <ng-container *ngIf="i === dataColumnsShow.length - 1">
                      <div
                        class="button-icon-wrapper"
                        (click)="showModalOrderableTable()"
                        [tooltip]="'Tùy chỉnh bảng'"
                        [placement]="'left'"
                      >
                        <button class="button-icon">
                          <img src="./assets/icons/setting-table.svg" alt="" />
                        </button>
                      </div>
                    </ng-container>
                  </div>
                </th>
              </ng-container>
            </tr>
            <tr *ngIf="getLengthCheckRow()">
              <th>
                <label class="basic-checkbox standalone">
                  <input
                    type="checkbox"
                    (change)="handleSelectRow({type: 'all', event: $event})"
                    [checked]="isAllChecked()"
                  />
                  <span class="checkmark"></span>
                </label>
              </th>
              <th [attr.colspan]="dataColumnsShow.length + 1">
                <div class="d-flex align-items-center gap-3">
                  <span>Đã chọn {{ getLengthCheckRow() }} bản ghi</span>
                  <ng-select
                    #selectBatchActions
                    appearance="outline"
                    [clearable]="false"
                    placeholder="Thao tác hàng loạt"
                    style="width: 250px"
                    [items]="multipleAction"
                    bindLabel="label"
                    bindValue="value"
                    (change)="showModalMultipleAction($event)"
                    appendTo="body"
                    class="ng-select ng-select-single"
                  ></ng-select>
                  <button
                    class="btn btn-sm btn-outline-secondary"
                    (click)="handleRefreshRow()"
                  >
                    Bỏ chọn tất cả
                  </button>
                </div>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr class="text-center" *ngIf="!item.rows.length && !item.loading">
              <td colspan="12">
                <div>Không có dữ liệu</div>
              </td>
            </tr>
            <tr class="text-center" *ngIf="item.loading">
              <td colspan="12">
                <div class="spinner-grow text-primary" role="status">
                  <span class="visually-hidden">Loading</span>
                </div>
                <div>Loading</div>
              </td>
            </tr>
            <tr *ngFor="let item of item.rows; index as i">
              <td>
                <label class="basic-checkbox">
                  <input
                    value="{{ item.id }}"
                    [checked]="isCheckRow(item)"
                    (change)="handleSelectRow({item, event: $event})"
                    (keydown)="isShift = true"
                    (keyup)="isShift = false"
                    type="checkbox"
                  />
                  <span class="checkmark"></span>
                </label>
              </td>

              <ng-container *ngFor="let columns of dataColumnsShow; index as i">
                <ng-container [ngSwitch]="columns.value">
                  <ng-container *ngSwitchCase="'name'">
                    <td>
                      <div
                        class="d-flex align-items-center gap-2 cursor-pointer"
                      >
                        <div class="lead-avatar-small">
                          <img
                            src="./assets/images/noavatar.png"
                            alt=""
                            width="48"
                            height="48"
                            class="img-fluid rounded-circle"
                          />

                          <div class="icon-type-lead">
                            <img
                              src="./assets/icons/icon-lead/lead.svg"
                              alt=""
                            />
                          </div>
                        </div>
                        <div class="d-flex flex-column gap-1">
                          <div
                            class="lead-name"
                            [routerLink]="['/lead']"
                            [queryParams]="{id: item.id}"
                          >
                            {{ item.name }}
                          </div>

                          <div class="d-flex flex-row flex-wrap gap-1">
                            <div *ngFor="let tagId of item.tagIds">
                              <span
                                class="text-capitalize tag-item"
                                [ngClass]="{
                                  nonBack: !getTagById(tagId)?.bgColor
                                }"
                                [ngStyle]="{
                                  background: getTagById(tagId)?.bgColor
                                }"
                              >
                                <span>
                                  <i class="fa-solid fa-filter"></i>
                                  {{ getTagById(tagId)?.name }}
                                </span>
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </td>
                  </ng-container>

                  <ng-container *ngSwitchCase="'phone'">
                    <td>
                      <span class="text-primary fw-500">
                        {{ item.phone }}
                      </span>
                    </td>
                  </ng-container>

                  <ng-container *ngSwitchCase="'email'">
                    <td>{{ item.email }}</td>
                  </ng-container>

                  <ng-container *ngSwitchCase="'status'">
                    <td>
                      <div
                        class="badge-status"
                        *ngIf="getStatusById(item.statusId) as status"
                        [ngStyle]="{
                          background: status?.bgColor || '#000' | hex2rgb,
                          color: status?.bgColor || '#fff'
                        }"
                      >
                        {{ status?.name || '-' }}
                      </div>
                    </td>
                  </ng-container>

                  <ng-container *ngSwitchCase="'taskId'">
                    <td>
                      <div *ngFor="let taskCode of item.taskCodes">
                        <span class="text-primary fw-500">
                          {{ taskCode }}
                        </span>
                      </div>
                    </td>
                  </ng-container>

                  <ng-container *ngSwitchCase="'orderId'">
                    <td>
                      <div *ngFor="let orderCode of item.orderCodes">
                        <span class="text-primary fw-500">
                          {{ orderCode }}
                        </span>
                      </div>
                    </td>
                  </ng-container>

                  <ng-container *ngSwitchCase="'createdAt'">
                    <td>{{ item.createdAt | timeView }}</td>
                  </ng-container>

                  <ng-container *ngSwitchCase="'updatedAt'">
                    <td class="text-center">{{ item.updatedAt | timeView }}</td>
                  </ng-container>
                </ng-container>
              </ng-container>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="lead-pagination">
    <custom-pagination
      [showConfig]="true"
      [selectedSize]="item.paramsQuery.limit!"
      [currentPage]="item.paramsQuery.page!"
      (changePageEvent)="pageChanged($event)"
      [total]="item.total"
      [optionSize]="[10, 20, 50, 100, 500, 1000]"
      [type]="item.rows.length > 10000 ? 'lazy' : 'number'"
      [maxRecords]="10000"
    />
  </div>
</div>
