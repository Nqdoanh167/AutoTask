<div>
  <div class="card">
    <div class="card-body">
      <div class="table-responsive tableFixHead custom-scrollbar">
        <table class="table ui-v2">
          <thead>
            <tr>
              <th>
                <label class="basic-checkbox standalone">
                  <input
                    type="checkbox"
                    (change)="handleSelectRow({type: 'all', event: $event})"
                    [checked]="isAllChecked()"
                  />
                  <span class="checkmark"></span>
                </label>
              </th>
              <th>Tên</th>
              <th>Số điện thoại</th>
              <th>Email</th>
              <th>Trạng thái Leads</th>
              <th>Tác vụ</th>
              <th>Đơn hàng</th>
              <th>Ngày tạo</th>
            </tr>
          </thead>
          <tbody>
            <tr class="text-center" *ngIf="!item.rows.length && !item.loading">
              <td colspan="12">
                <div>Không có dữ liệu</div>
              </td>
            </tr>
            <tr class="text-center" *ngIf="item.loading">
              <td colspan="12">
                <div class="spinner-grow text-primary" role="status">
                  <span class="visually-hidden">Loading</span>
                </div>
                <div>Loading</div>
              </td>
            </tr>
            <tr *ngFor="let item of item.rows; index as i">
              <td>
                <label class="basic-checkbox">
                  <input
                    value="{{ item.id }}"
                    [checked]="isCheckRow(item)"
                    (change)="handleSelectRow({item, event: $event})"
                    (keydown)="isShift = true"
                    (keyup)="isShift = false"
                    type="checkbox"
                  />
                  <span class="checkmark"></span>
                </label>
              </td>
              <td>
                <div class="d-flex align-items-center gap-2 cursor-pointer">
                  <div class="lead-avatar-small">
                    <img
                      src="./assets/images/noavatar.png"
                      alt=""
                      width="48"
                      height="48"
                      class="img-fluid rounded-circle"
                    />

                    <div class="icon-type-lead">
                      <img src="./assets/icons/icon-lead/lead.svg" alt="" />
                    </div>
                  </div>
                  <div class="d-flex flex-column gap-1">
                    <div
                      class="lead-name"
                      [routerLink]="['/lead']"
                      [queryParams]="{id: item.id}"
                    >
                      {{ item.name }}
                    </div>

                    <div class="d-flex flex-row flex-wrap gap-1">
                      <div *ngFor="let tagId of item.tagIds">
                        <span
                          class="text-capitalize tag-item"
                          [ngClass]="{
                            nonBack: !getTagById(tagId)?.bgColor
                          }"
                          [ngStyle]="{
                            background: getTagById(tagId)?.bgColor
                          }"
                        >
                          <span>
                            <i class="fa-solid fa-filter"></i>
                            {{ getTagById(tagId)?.name }}
                          </span>
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              </td>
              <td>
                <span class="text-primary fw-500">
                  {{ item.phone }}
                </span>
              </td>
              <td>{{ item.email }}</td>
              <td>
                <div
                  class="lead-status-badge"
                  *ngIf="getStatusById(item.statusId) as status"
                  [ngStyle]="{
                    background: status?.bgColor || '#000'
                  }"
                >
                  {{ status?.name || '-' }}
                </div>
              </td>
              <td>
                <div *ngFor="let taskCode of item.taskCodes">
                  <span class="text-primary fw-500">
                    {{ taskCode }}
                  </span>
                </div>
              </td>
              <td>
                <div *ngFor="let orderCode of item.orderCodes">
                  <span class="text-primary fw-500">
                    {{ orderCode }}
                  </span>
                </div>
              </td>
              <td>{{ item.createdAt | timeView }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="lead-pagination">
    <custom-pagination
      [showConfig]="true"
      [selectedSize]="item.paramsQuery.limit!"
      [currentPage]="item.paramsQuery.page!"
      (changePageEvent)="pageChanged($event)"
      [total]="item.total"
      [optionSize]="[10, 20, 50, 100, 500, 1000]"
      [type]="item.rows.length > 10000 ? 'lazy' : 'number'"
      [maxRecords]="10000"
    />
  </div>
</div>
