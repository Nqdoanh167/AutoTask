<div class="modal-header">
  <h4 class="modal-title">Sắp xếp vị trí trạng thái lead</h4>
  <button type="button" class="btn-close" (click)="onCancel()"></button>
</div>

<div class="modal-body">
  <div class="mb-3">
    <p class="text-muted">Kéo thả để sắp xếp thứ tự các trạng thái lead theo ý muốn.</p>
  </div>

  <div class="status-list" cdkDropList (cdkDropListDropped)="onDrop($event)">
    <div
      class="status-item d-flex align-items-center gap-3 p-3 border rounded mb-2"
      *ngFor="let status of statuses; let i = index; trackBy: trackByStatusId"
      cdkDrag
      [cdkDragData]="status"
    >
      <div class="drag-handle">
        <i class="fa fa-grip-vertical text-muted"></i>
      </div>

      <div class="status-color" [style.background-color]="status.bgColor"></div>

      <div class="status-info flex-grow-1">
        <div class="fw-semibold">{{ status.name }}</div>
        <div class="text-muted small" *ngIf="status.description">{{ status.description }}</div>
      </div>

      <div class="status-type">
        <span class="badge bg-secondary">{{ status.type }}</span>
      </div>
    </div>
  </div>

  <div class="mt-3" *ngIf="loading">
    <div class="d-flex align-items-center gap-2">
      <i class="fa fa-spinner fa-spin"></i>
      <span>Đang cập nhật...</span>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="onCancel()">Đóng</button>
</div>
