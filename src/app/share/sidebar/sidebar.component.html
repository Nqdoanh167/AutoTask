<aside class="sidebar">
  <ng-container *ngIf="biz">
    <smaxapp-logo
      [bizAlias]="biz.alias"
      [currentModule]="biz.module"
      [modules]="biz.modules"
      [quickModules]="biz.user.quickModules"
      [menuPlacement]="'right'"
    ></smaxapp-logo>
  </ng-container>
  <div class="sidebar__items mt-1">
    <div
      class="item none"
      *ngFor="let item of sidebars"
      [ngClass]="{active: item.isActive, disabled: item.disabled}"
    >
      <ng-container *ngIf="item.children?.length">
        <div class="item-link" [tooltip]="item.name">
          <img
            [src]="!item.isActive ? item.icon : item.iconActive"
            alt=""
            class="icon"
          />
        </div>
        <div class="item__child">
          <div class="item" *ngFor="let child of item.children">
            <a [routerLink]="child.link" class="item-link">
              {{ child.name }}
            </a>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="!item.children?.length">
        <a [routerLink]="item.link" class="item-link">
          <img
            [src]="!item.isActive ? item.icon : item.iconActive"
            alt=""
            class="icon"
          />
        </a>
        <span class="tooltip">{{ item.name }}</span>
      </ng-container>
    </div>
  </div>
</aside>
