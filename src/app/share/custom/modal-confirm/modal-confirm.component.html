<ng-template #template>
  <div class="custom-modal-confirm" [ngClass]="modalContent.type">
    <div class="modal-body">
      <div class="d-flex justify-content-between">
        <div class="d-flex gap-3">
          <ng-container [ngSwitch]="modalContent.type">
            <div *ngSwitchCase="'warning'">
              <ng-container *ngTemplateOutlet="iconWarning"></ng-container>
            </div>
            <div *ngSwitchCase="'info'">
              <ng-container *ngTemplateOutlet="iconInfo"></ng-container>
            </div>
          </ng-container>

          <div
            class="d-flex flex-column justify-content-start align-items-start"
          >
            <h5 class="modal-title pull-left">{{ modalContent.title }}</h5>
            <span class="text-description text-left">
              {{ modalContent.description }}
            </span>
          </div>
        </div>
        <button
          type="button"
          class="btn-close close"
          aria-label="Close"
          (click)="hideModal()"
        >
          <span aria-hidden="true" class="visually-hidden">
            <i class="fa-solid fa-xmark"></i>
          </span>
        </button>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button
          type="button"
          class="btn button-outline button-cancel"
          (click)="decline()"
        >
          {{ modalContent.cancelText || 'Hủy' }}
        </button>
        <button
          type="button"
          class="btn btn-primary button-confirm"
          [ngClass]="modalContent.type"
          (click)="confirm()"
        >
          {{ modalContent.okText || 'Lưu' }}
        </button>
      </div>
    </div>
    <div
      class="overlay"
      (click)="handleClickOverlay($event)"
      [ngClass]="{show: isOpenBackdrop, hide: !isOpenBackdrop}"
    ></div>
  </div>
</ng-template>

<ng-template #templateAdvance>
  <div
    class="custom-modal-confirm"
    [ngClass]="modalContent.type"
    [class.outstanding]="isClickOverlay"
  >
    <div class="modal-body">
      <div class="d-flex flex-column justify-content-center align-items-center">
        <h5
          class="modal-title pull-left text-center"
          [innerHTML]="modalContent.title"
        ></h5>
        <p
          class="mb-2 text-description"
          style="white-space: pre-line"
          [innerHTML]="modalContent.description"
        ></p>
      </div>
      <div class="mb-3">
        <ng-content select="[childContent]"></ng-content>
        @if (modalContent.errorState) {
          <div class="state-warning d-flex gap-2">
            <div><i class="fa-solid fa-circle-info"></i></div>
            <div>{{ modalContent.errorState }}</div>
          </div>
        }
      </div>
      <div
        class="d-flex justify-content-center gap-2 mt-2"
        [ngClass]="{'flex-row-reverse': modalContent.type === 'warning'}"
      >
        <button
          type="button"
          class="btn button-outline button-advance"
          (click)="decline()"
        >
          {{ modalContent.cancelText || 'Hủy' }}
        </button>
        <button
          type="button"
          class="btn btn-primary button-confirm button-advance"
          [ngClass]="modalContent.type"
          (click)="confirm()"
        >
          {{ modalContent.okText || 'Lưu' }}
        </button>
      </div>
    </div>
    <div
      class="overlay"
      (click)="handleClickOverlay($event)"
      [ngClass]="{show: isOpenBackdrop, hide: !isOpenBackdrop}"
    ></div>
  </div>
</ng-template>
