<div class="custom-date-picker" [ngClass]="className">
  <ng-container *ngIf="typePicker === 'range'">
    <img
      (click)="dpr?.show()"
      [attr.aria-expanded]="dpr.isOpen"
      src="./assets/icons/calendar.svg"
      class="icon"
    />
    <input
      type="text"
      bsDaterangepicker
      #dpr="bsDaterangepicker"
      [bsConfig]="bsConfig"
      [bsValue]="bsRangeValue"
      (bsValueChange)="handleChangeDate($event)"
      [placeholder]="placeholder"
      [style]="style"
    />
  </ng-container>
  <ng-container *ngIf="typePicker === 'single'">
    <img
      (click)="dpr.show()"
      [attr.aria-expanded]="dpr.isOpen"
      src="./assets/icons/calendar.svg"
      class="icon"
    />
    <input
      type="text"
      bsDatepicker
      #dpr="bsDatepicker"
      [bsConfig]="bsConfig"
      [bsValue]="bsValue"
      (bsValueChange)="handleChangeDate($event)"
      [placeholder]="placeholder"
      [style]="style"
    />
  </ng-container>
</div>
