<div class="input-suggest-customer">
  @if (uiType === 'text') {
    <input
      autocomplete="off"
      class="form-control input-main {{ className }}"
      (input)="onSearch($event)"
      (blur)="trigger.name = false"
      (focus)="trigger.name = true"
      [placeholder]="placeholder"
      [(ngModel)]="value"
      id="{{ inputId }}"
      type="text"
    />
  } @else {
    <div class="input-search-main form-control {{ className }}">
      <div class="input-search-icon">
        @if (customers.loading) {
          <i class="fas fa-spinner fa-spin"></i>
        } @else {
          <i class="fa-solid fa-magnifying-glass"></i>
        }
      </div>
      <input
        autocomplete="off"
        (input)="onSearch($event)"
        (blur)="trigger.name = false"
        (focus)="trigger.name = true"
        [placeholder]="placeholder"
        [(ngModel)]="value"
        id="{{ inputId }}"
        type="text"
      />
    </div>
  }
  <ng-select
    [(ngModel)]="selectedCustomer"
    class="suggest-select"
    (change)="handleChooseCustomer($event)"
    (blur)="handleBlur($event)"
    [items]="customers.rows"
    [trackByFn]="trackByFn"
    bindLabel="name"
    bindValue="id"
    [clearable]="false"
    [isOpen]="trigger.name && customers.rows.length > 0"
    [closeOnSelect]="true"
    [placeholder]="'Nhập Tên...'"
    appendTo=".modal"
  >
    <ng-template ng-option-tmp let-item="item">
      <div
        class="person-info d-flex justify-content-between align-items-center"
      >
        <div class="d-flex justify-content-between align-items-center">
          <img
            class="avatar"
            alt=""
            fallback="assets/images/avatar.svg"
            src="{{ item?.picture }}"
          />
          <div class="d-flex flex-column mx-3">
            <span class="account-name fw-500">{{ item?.name }}</span>
            <span class="account-phone">{{ item?.phone }}</span>
          </div>
        </div>
      </div>
    </ng-template>
  </ng-select>
</div>
