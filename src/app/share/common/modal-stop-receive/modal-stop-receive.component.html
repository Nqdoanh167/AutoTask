<div>
  <div class="modal-header">
    <h4 class="modal-title pull-left">Ngừng nhận số</h4>
    <button
      type="button"
      class="btn-close close pull-right"
      aria-label="Close"
      (click)="bsModalRef.hide()"
    >
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="alert alert-info mt-3">Hệ thống sẽ không chia số cho bạn</div>
  <div class="modal-body">
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <div class="stop-options">
        <div *ngFor="let option of stopOptions" class="option-item">
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              [id]="option.id"
              [value]="option.id"
              formControlName="stopDuration"
            />
            <label class="form-check-label" [for]="option.id">
              {{ option.label }}
            </label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end mt-3 gap-2">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="bsModalRef.hide()"
        >
          Hủy
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-1"
            role="status"
            aria-hidden="true"
          ></span>
          Lưu lại
        </button>
      </div>
    </form>
  </div>
</div>
