<div class="modal-call-in" [ngClass]="collapsed ? 'modal-call-collapse' : ''">
    <div class="modal-call-in-header" *ngIf="!collapsed">
        <img src="./assets/images/call/icon-call-out.png" alt="" class="icon-call-in" />

        <span class="title-5">Cuộc gọi đi</span>
    </div>
    <div class="modal-call-in-body">
        <div class="" [ngClass]="collapsed ? 'modal-call-collapse' : 'mb-5'">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                    <div class="customer-avatar" *ngIf="customer?.picture">
                        <img src="{{customer?.picture}}" alt="" class="" />
                    </div>
                    <div class="customer-info">
                        <div class="title-5">{{customer?.name ? customer?.name : 'Chưa có thông tin khách hàng'}}</div>
                        <div>0975842740</div>
                    </div>
                </div>
                <img *ngIf="customer" src="./assets/images/call/icon-caret-right.svg" alt="" class="icon-caret-right" (click)="showInfo = !showInfo" />
            </div>
            <ng-container *ngIf="!collapsed">
                <div class="mb-3">
                    <span class="me-1">Trạng thái kết nối</span>
                    <span class="text-success">Thành công</span>
                </div>
                <div class="mb-3">
                    <div class="mb-1">Ghi chú</div>
                    <textarea class="form-control note-box" rows="10"></textarea>
                </div>
                <div class="mb-3">
                    <span class="me-1">Thời lượng cuộc gọi</span>
                    <span class="text-success">02:39</span>
                </div>
            </ng-container>
        </div>

        <div class="d-flex justify-content-between">
            <div class="call-btn call-btn-collapse" (click)="changeCollapse()">
                <img src="./assets/images/call/icon-collapse-{{collapsed ? 'open' : 'close'}}.svg" alt="">
            </div>
            <div class="call-btn" (click)="changeMute()" [ngClass]="muted ? 'call-btn-collapse' : 'call-btn-cancel'">
                <img src="./assets/images/call/icon-mic.svg" alt="">
            </div>
            <div class="call-btn call-btn-cancel">
                <img src="./assets/images/call/icon-cancel-call.svg" alt="">
            </div>
        </div>
    </div>
    <div class="position-relative" *ngIf="showInfo && customer">
        <div class="call-customer-info out">
            <app-common-call-customer-info
                    (onClose)="showInfo = false"
                    [customer]="customer"
            ></app-common-call-customer-info>
        </div>
    </div>
</div>
