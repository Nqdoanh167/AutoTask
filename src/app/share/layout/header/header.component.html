<div class="navbar-component">
  <div class="d-flex justify-content-between align-items-center h-100">
    <div class="d-flex">
      <ng-content select=".left"></ng-content>
      <app-breadcrumb
        [breadcrumbList]="breadcrumbList"
        *ngIf="breadcrumbList.length"
      ></app-breadcrumb>
    </div>
    <div>
      <div class="d-flex">
        <ng-content select=".right"></ng-content>
        <div class="frame-avatar d-flex align-items-center" *ngIf="user">
          <div class="btn-group" dropdown placement="bottom right">
            <img
              id="button-alignment"
              dropdownToggle
              class="avatar"
              aria-controls="dropdown-alignment"
              [src]="user.picture"
              alt="avatar"
            />
            <ul
              id="dropdown-alignment"
              *dropdownMenu
              class="dropdown-menu dropdown-menu-right"
              role="menu"
              aria-labelledby="button-alignment"
            >
              <li role="menuitem" *ngIf="['MOD', 'ADMIN'].includes(user.role!)">
                <a class="dropdown-item" [routerLink]="'/admin/setting/job'">
                  Quản trị
                </a>
              </li>
              <li role="menuitem">
                <a class="dropdown-item" href="/user">Thông tin cá nhân</a>
              </li>
              <li role="menuitem" (click)="logout()">
                <a class="dropdown-item" href="#">Đăng xuất</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
